# /etc/nginx/sites-available/disputeiq.conf
# Reverse proxy for DisputeIQ on a Hostinger VPS.
# Assumes Next.js running on 127.0.0.1:3000 (PM2 or systemd).
# SSL provisioned via certbot --nginx (Let's Encrypt).

upstream disputeiq_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

# --- HTTP -> HTTPS redirect for all hosts ----------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name disputeiq.org www.disputeiq.org app.disputeiq.org admin.disputeiq.org api.disputeiq.org;
  return 301 https://$host$request_uri;
}

# --- Marketing: disputeiq.org ----------------------------------------------
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name disputeiq.org www.disputeiq.org;

  ssl_certificate     /etc/letsencrypt/live/disputeiq.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/disputeiq.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  client_max_body_size 25m;

  location / {
    proxy_pass         http://disputeiq_app;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
  }
}

# --- App: app.disputeiq.org ------------------------------------------------
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.disputeiq.org;

  ssl_certificate     /etc/letsencrypt/live/app.disputeiq.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.disputeiq.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  client_max_body_size 25m;

  # Webhook bodies must be passed raw (HMAC verification).
  location /api/webhooks/ {
    proxy_pass         http://disputeiq_app;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass         http://disputeiq_app;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
  }
}

# --- Reserved subdomains: admin + api --------------------------------------
# Both currently proxy to the same Next.js process; the middleware in the app
# rewrites paths so admin.disputeiq.org -> /admin/* and api.disputeiq.org -> /api/*.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.disputeiq.org api.disputeiq.org;

  ssl_certificate     /etc/letsencrypt/live/app.disputeiq.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.disputeiq.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  client_max_body_size 25m;

  location / {
    proxy_pass         http://disputeiq_app;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
